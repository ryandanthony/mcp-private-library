<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MCP Private Library</title>
  <meta name="description" content="Index GitHub repositories and websites into a private, semantically searchable document library." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/repos.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/keys.css" />
</head>
<body>
  <!-- Skip link for keyboard / screen-reader users -->
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app-shell">
    <!-- ================= Left navigation ================= -->
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span class="brand-name">MCP Library</span>
      </div>
      <nav class="nav">
        <a class="nav-link" data-nav="home" href="#/home">
          <span class="nav-ico" aria-hidden="true">＋</span> Add source
        </a>
        <a class="nav-link" data-nav="repos" href="#/repos">
          <span class="nav-ico" aria-hidden="true">▤</span> Repositories
        </a>
        <a class="nav-link" data-nav="search" href="#/search">
          <span class="nav-ico" aria-hidden="true">⌕</span> Search
        </a>
        <a class="nav-link" data-nav="keys" href="#/keys">
          <span class="nav-ico" aria-hidden="true">⚿</span> API keys
        </a>
      </nav>
      <div id="auth-bar" class="auth-bar" aria-live="polite"></div>
    </aside>

    <!-- ================= Main content ================= -->
    <main id="main" class="content">
      <!-- Each screen owns exactly one of these containers. -->
      <section id="view-home" class="view" hidden></section>
      <section id="view-repos" class="view" hidden></section>
      <section id="view-search" class="view" hidden></section>
      <section id="view-keys" class="view" hidden></section>
    </main>
  </div>

  <!-- Core shell first (defines window.App + landing screen), then screen modules. -->
  <script src="js/core.js"></script>
  <script src="js/repos.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/keys.js" defer></script>
</body>
</html>
